<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弘九honjiu的Blog</title>
<meta name="description" content="">
<style>
:root{
  --md-primary:#1976d2;--md-primary-dark:#1565c0;
  --md-bg:#f5f5f5;--md-surface:#fff;
  --md-text:#212121;--md-text-secondary:#757575;
  --md-divider:#e0e0e0;
  --md-shadow-1:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.24);
  --md-shadow-2:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(0,0,0,.23);
  --md-radius:2px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Roboto","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--md-bg);color:var(--md-text);line-height:1.6;
}
a{color:var(--md-primary);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- App Bar ---------- */
.app-bar{position:sticky;top:0;z-index:30;background:var(--md-primary);color:#fff;box-shadow:var(--md-shadow-1)}
.app-bar-inner{max-width:960px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:8px}
.menu-btn{display:none;background:transparent;border:none;color:#fff;padding:8px;margin-left:-8px;cursor:pointer;border-radius:50%;align-items:center;justify-content:center}
.menu-btn:hover{background:rgba(255,255,255,.12)}
.app-bar-title{color:#fff;font-size:20px;font-weight:500;letter-spacing:.3px}
.app-bar-title:hover{text-decoration:none}
.app-bar-nav{margin-left:auto;display:flex;gap:4px}
.app-bar-nav a{color:rgba(255,255,255,.85);padding:8px 14px;border-radius:2px;font-size:14px;transition:background .15s}
.app-bar-nav a:hover{color:#fff;background:rgba(255,255,255,.12);text-decoration:none}
.app-bar-nav a.active{color:#fff;background:rgba(255,255,255,.22)}

/* ---------- Drawer ---------- */
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:var(--md-surface);z-index:40;box-shadow:var(--md-shadow-2);transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;transition:opacity .25s}
.drawer-scrim.open{opacity:1}
.drawer-scrim[hidden]{display:none}
.drawer-header{padding:20px 16px 16px;background:var(--md-primary);color:#fff}
.drawer-title{font-size:20px;font-weight:500}
.drawer-subtitle{font-size:13px;opacity:.8;margin-top:2px}
.drawer-nav{padding:8px 0;overflow-y:auto}
.drawer-nav a{display:block;padding:14px 16px;color:var(--md-text);font-size:14px;font-weight:500;border-left:3px solid transparent}
.drawer-nav a:hover{background:#f5f5f5;text-decoration:none}
.drawer-nav a.active{color:var(--md-primary);background:#e3f2fd;border-left-color:var(--md-primary)}

/* ---------- Layout ---------- */
.container{max-width:960px;margin:0 auto;padding:24px 16px 48px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--md-surface);border-radius:var(--md-radius);box-shadow:var(--md-shadow-1);padding:16px;text-align:center}
.stat-value{font-size:28px;font-weight:500;color:var(--md-primary)}
.stat-label{font-size:12px;color:var(--md-text-secondary);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* ---------- Announcement ---------- */
.announcement{background:#fff8e1;border-left:4px solid #ffc107;padding:12px 16px;border-radius:var(--md-radius);margin-bottom:20px;box-shadow:var(--md-shadow-1);font-size:14px;color:#6d4c41}

/* ---------- Search ---------- */
.field{margin-bottom:20px}
.field input{width:100%;padding:12px 16px;font-size:15px;border:none;border-bottom:2px solid var(--md-divider);background:var(--md-surface);border-radius:var(--md-radius) var(--md-radius) 0 0;box-shadow:var(--md-shadow-1);outline:none;transition:border-color .2s}
.field input:focus{border-bottom-color:var(--md-primary)}

/* ---------- Post list ---------- */
.post-list{display:grid;gap:16px}
.post-card{background:var(--md-surface);border-radius:var(--md-radius);box-shadow:var(--md-shadow-1);padding:16px 20px;transition:box-shadow .2s,transform .2s}
.post-card:hover{box-shadow:var(--md-shadow-2);transform:translateY(-2px)}
.post-card h2{margin:0 0 6px;font-size:20px;font-weight:500}
.post-card h2 a{color:var(--md-text)}
.post-card h2 a:hover{color:var(--md-primary);text-decoration:none}
.post-meta{font-size:13px;color:var(--md-text-secondary);margin-bottom:8px}
.post-summary{font-size:14px;color:#424242;margin:0}

/* ---------- Empty ---------- */
.empty{text-align:center;color:var(--md-text-secondary);padding:40px 0;font-size:15px}

/* ---------- Pagination ---------- */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:24px;flex-wrap:wrap}
.page-btn{min-width:36px;height:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;background:var(--md-surface);border:1px solid var(--md-divider);border-radius:var(--md-radius);color:var(--md-text);cursor:pointer;font-size:14px;transition:all .15s}
.page-btn:hover:not(:disabled){border-color:var(--md-primary);color:var(--md-primary)}
.page-btn.active{background:var(--md-primary);color:#fff;border-color:var(--md-primary)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Page title ---------- */
.page-title{font-size:24px;font-weight:500;margin:0 0 20px}

/* ---------- Article ---------- */
.article{background:var(--md-surface);border-radius:var(--md-radius);box-shadow:var(--md-shadow-1);padding:24px 28px}
.article-title{margin:0 0 8px;font-size:28px;font-weight:500;line-height:1.3}
.article-meta{font-size:14px;color:var(--md-text-secondary);margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--md-divider)}
.article-body h1,.article-body h2,.article-body h3{font-weight:500}
.article-body h1{font-size:26px;margin:28px 0 14px}
.article-body h2{font-size:22px;margin:24px 0 12px}
.article-body h3{font-size:18px;margin:20px 0 10px}
.article-body p{margin:0 0 14px}
.article-body ul,.article-body ol{margin:0 0 14px;padding-left:24px}
.article-body blockquote{margin:16px 0;padding:10px 16px;border-left:4px solid var(--md-primary);background:#f5f9ff;color:#37474f}
.article-body code{background:#f0f0f0;padding:2px 6px;border-radius:3px;font-size:90%;font-family:"Roboto Mono",Consolas,monospace}
.article-body pre{background:#263238;color:#eceff1;padding:16px;border-radius:var(--md-radius);overflow-x:auto}
.article-body pre code{background:transparent;padding:0;color:inherit}
.article-body img{max-width:100%;border-radius:var(--md-radius)}
.article-body hr{border:none;border-top:1px solid var(--md-divider);margin:20px 0}
.back-link{display:inline-block;margin-bottom:16px;font-size:14px}

/* ---------- Post nav ---------- */
.post-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.post-nav a{display:block;background:var(--md-surface);padding:14px 16px;border-radius:var(--md-radius);box-shadow:var(--md-shadow-1);font-size:14px;color:var(--md-text);transition:box-shadow .2s}
.post-nav a:hover{box-shadow:var(--md-shadow-2);text-decoration:none}
.post-nav .nav-label{font-size:12px;color:var(--md-text-secondary);margin-bottom:4px}
.post-nav .nav-title{color:var(--md-primary);font-weight:500}
.post-nav .nav-right{text-align:right}

/* ---------- Archive ---------- */
.archive-group{margin-bottom:28px}
.archive-month{font-size:16px;font-weight:500;color:var(--md-primary);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--md-divider)}
.archive-list{list-style:none;margin:0;padding:0}
.archive-list li{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
.archive-date{color:var(--md-text-secondary);font-size:13px;min-width:100px;font-family:"Roboto Mono",Consolas,monospace}
.archive-list a{flex:1;color:var(--md-text)}
.archive-list a:hover{color:var(--md-primary);text-decoration:none}
.archive-author{color:var(--md-text-secondary);font-size:13px}

/* ---------- Error ---------- */
.error-box{background:#ffebee;border-left:4px solid #f44336;color:#b71c1c;padding:16px 20px;border-radius:var(--md-radius);box-shadow:var(--md-shadow-1);margin-bottom:20px}
.error-box h3{margin:0 0 8px;font-size:16px}
.error-box p{margin:0 0 8px;font-size:14px}
.error-box code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px}
.error-hint{color:#c62828;font-size:13px !important}

/* ---------- Back to top ---------- */
.to-top{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border-radius:50%;background:var(--md-primary);color:#fff;border:none;box-shadow:var(--md-shadow-2);cursor:pointer;font-size:20px;display:none;align-items:center;justify-content:center;transition:background .2s;z-index:20}
.to-top.show{display:flex}
.to-top:hover{background:var(--md-primary-dark)}

/* ---------- Footer ---------- */
.site-footer{margin-top:40px;padding:20px 0;border-top:1px solid var(--md-divider);text-align:center;font-size:13px;color:var(--md-text-secondary)}
.site-footer code{background:#eee;padding:1px 5px;border-radius:3px}

/* ---------- Responsive ---------- */
@media (max-width:767px){
  .menu-btn{display:inline-flex}
  .app-bar-nav{display:none}
  .article{padding:18px}
  .article-title{font-size:22px}
  .stat-value{font-size:22px}
  .post-nav{grid-template-columns:1fr}
  .post-nav .nav-right{text-align:left}
  .archive-list li{flex-wrap:wrap;gap:6px}
  .archive-date{min-width:auto}
}
</style>
</head>
<body>

<header class="app-bar">
  <div class="app-bar-inner">
    <button class="menu-btn" id="menu-btn" aria-label="打开菜单">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
      </svg>
    </button>
    <a class="app-bar-title" href="#/" id="site-title">弘九honjiu的Blog</a>
    <nav class="app-bar-nav" id="top-nav">
      <a href="#/" data-route="home">首页</a>
      <a href="#/archive" data-route="archive">归档</a>
      <a href="#/about" data-route="about">关于</a>
    </nav>
  </div>
</header>

<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <div class="drawer-title" id="drawer-title">弘九honjiu的BLog</div>
    <div class="drawer-subtitle">honjiu.neox.lol/blog/</div>
  </div>
  <nav class="drawer-nav" id="drawer-nav">
    <a href="#/" data-route="home">首页</a>
    <a href="#/archive" data-route="archive">归档</a>
    <a href="#/about" data-route="about">关于</a>
  </nav>
</aside>

<main class="container" id="app">
  <div class="empty">加载中…</div>
</main>

<footer class="site-footer">
  <div class="container" style="padding-top:0;padding-bottom:0">
    <p>© 2025-2026 弘九honjiu All rights reserved.<br><code>honjiu.neox.lol</code></p>
  </div>
</footer>

<button class="to-top" aria-label="回到顶部">↑</button>

<script>
(function () {
'use strict';

/* ================= 配置 ================= */
const CONFIG = {
  title: '弘九honjiu的Blog',
  jsonPath: 'posts/posts.json',
  mdDir: 'posts/',
  pageSize: 5
};

const app = document.getElementById('app');
const homeState = { query: '', page: 1 };
let dataCache = null;

/* ================= 工具函数 ================= */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function formatDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return String(s);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function sortByDateDesc(posts) {
  return posts.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
}
function isCJK(ch) {
  if (!ch) return false;
  return /[\u3000-\u303f\u4e00-\u9fa5\uff00-\uffef]/.test(ch);
}
function joinLines(lines) {
  let out = '';
  for (let i = 0; i < lines.length; i++) {
    out += lines[i];
    if (i < lines.length - 1) {
      const a = lines[i].slice(-1), b = lines[i + 1].slice(0, 1);
      if (!isCJK(a) && !isCJK(b)) out += ' ';
    }
  }
  return out;
}

/* ---------- 简易 Markdown 解析器 ---------- */
function inlineMd(text) {
  let s = escapeHtml(text);
  s = s.replace(/`([^`]+)`/g, function (_, c) { return '<code>' + c + '</code>'; });
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_, alt, src) {
    return '<img src="' + src + '" alt="' + alt + '">';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
    return '<a href="' + u + '">' + t + '</a>';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s;
}
function mdToHtml(md) {
  const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let i = 0, inCode = false, codeLang = '', codeBuf = [];
  let listType = null, listBuf = [];
  let paraBuf = [];

  function flushList() {
    if (!listType) return;
    out.push('<' + listType + '>' + listBuf.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</' + listType + '>');
    listType = null; listBuf = [];
  }
  function flushPara() {
    if (!paraBuf.length) return;
    out.push('<p>' + inlineMd(joinLines(paraBuf)) + '</p>');
    paraBuf = [];
  }
  function flushAll() { flushList(); flushPara(); }

  while (i < lines.length) {
    const line = lines[i];
    if (line.slice(0, 3) === '```') {
      if (!inCode) { flushAll(); inCode = true; codeLang = line.slice(3).trim(); codeBuf = []; }
      else {
        inCode = false;
        out.push('<pre><code' + (codeLang ? ' class="lang-' + escapeHtml(codeLang) + '"' : '') + '>' +
          escapeHtml(codeBuf.join('\n')) + '</code></pre>');
      }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    if (line.trim() === '') { flushAll(); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) { flushAll(); out.push('<hr>'); i++; continue; }
    const h = line.match(/^(#{1,6})\s+(.+)$/);
    if (h) {
      flushAll();
      out.push('<h' + h[1].length + '>' + inlineMd(h[2]) + '</h' + h[1].length + '>');
      i++; continue;
    }
    if (line.slice(0, 2) === '> ') {
      flushAll();
      const buf = [];
      while (i < lines.length && lines[i].slice(0, 2) === '> ') { buf.push(lines[i].slice(2)); i++; }
      out.push('<blockquote>' + mdToHtml(buf.join('\n')) + '</blockquote>');
      continue;
    }
    if (/^[-*+]\s+/.test(line)) {
      flushPara();
      if (listType !== 'ul') { flushList(); listType = 'ul'; }
      listBuf.push(inlineMd(line.replace(/^[-*+]\s+/, '')));
      i++; continue;
    }
    if (/^\d+\.\s+/.test(line)) {
      flushPara();
      if (listType !== 'ol') { flushList(); listType = 'ol'; }
      listBuf.push(inlineMd(line.replace(/^\d+\.\s+/, '')));
      i++; continue;
    }
    flushList();
    paraBuf.push(line);
    i++;
  }
  flushAll();
  if (inCode) out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
  return out.join('\n');
}

/* ================= 数据层（仅远端） ================= */
async function getData() {
  if (dataCache) return dataCache;
  const res = await fetch(CONFIG.jsonPath, { cache: 'no-store' });
  if (!res.ok) throw new Error('无法加载 ' + CONFIG.jsonPath + '（HTTP ' + res.status + '）');
  const json = await res.json();
  if (!Array.isArray(json.posts)) json.posts = [];
  if (!json.site || typeof json.site !== 'object') json.site = {};
  dataCache = json;
  return dataCache;
}

function errorBlock(msg) {
  return '<div class="error-box">' +
    '<h3>数据加载失败</h3>' +
    '<p>' + escapeHtml(msg) + '</p>' +
    '<p class="error-hint">请确认 <code>posts/posts.json</code> 存在，且检查网络设置。</p>' +
    '</div>';
}

/* ================= 站点标题动态更新 ================= */
async function updateSiteTitle() {
  try {
    const data = await getData();
    const title = (data.site && data.site.title) || CONFIG.title;
    const siteTitle = document.getElementById('site-title');
    const drawerTitle = document.getElementById('drawer-title');
    if (siteTitle) siteTitle.textContent = title;
    if (drawerTitle) drawerTitle.textContent = title;
  } catch (e) { /* 保持默认标题 */ }
}

/* ================= Drawer 菜单 ================= */
function openDrawer() {
  const scrim = document.getElementById('drawer-scrim');
  const drawer = document.getElementById('drawer');
  scrim.hidden = false;
  requestAnimationFrame(function () {
    scrim.classList.add('open');
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
  });
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  const scrim = document.getElementById('drawer-scrim');
  const drawer = document.getElementById('drawer');
  if (!scrim || !drawer) return;
  scrim.classList.remove('open');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  setTimeout(function () {
    if (!scrim.classList.contains('open')) scrim.hidden = true;
  }, 260);
}
document.getElementById('menu-btn').addEventListener('click', openDrawer);
document.getElementById('drawer-scrim').addEventListener('click', closeDrawer);
document.getElementById('drawer-nav').addEventListener('click', function (e) {
  if (e.target.closest('a')) closeDrawer();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeDrawer();
});

/* ================= 路由 ================= */
function parseHash() {
  const h = (location.hash || '').replace(/^#/, '') || '/';
  if (h === '/' || h === '') return { route: 'home' };
  if (h === '/archive') return { route: 'archive' };
  if (h === '/about') return { route: 'about' };
  if (h.indexOf('/post/') === 0) return { route: 'post', id: decodeURIComponent(h.slice(6)) };
  return { route: 'home' };
}
function updateActiveNav(r) {
  const map = { home: 'home', archive: 'archive', about: 'about', post: 'home' };
  const current = map[r.route] || 'home';
  document.querySelectorAll('[data-route]').forEach(function (a) {
    a.classList.toggle('active', a.dataset.route === current);
  });
}

async function render() {
  const r = parseHash();
  updateActiveNav(r);
  closeDrawer();
  window.scrollTo(0, 0);

  if (r.route === 'home') return renderHome();
  if (r.route === 'archive') return renderArchive();
  if (r.route === 'about') return renderAbout();
  if (r.route === 'post') return renderPost(r.id);
}

window.addEventListener('hashchange', render);

/* ================= 首页 ================= */
async function renderHome() {
  let data;
  try { data = await getData(); }
  catch (e) { app.innerHTML = errorBlock(e.message); return; }

  const posts = sortByDateDesc(data.posts);
  document.title = (data.site.title || CONFIG.title);

  app.innerHTML =
    '<section id="stats" class="stats"></section>' +
    (data.site.announcement ? '<section class="announcement">' + escapeHtml(data.site.announcement) + '</section>' : '') +
    '<div class="field"><input id="search" type="text" placeholder="搜索标题 / 作者 / 摘要" autocomplete="off" value="' +
      escapeHtml(homeState.query) + '"></div>' +
    '<section id="post-list" class="post-list"></section>' +
    '<div id="empty" class="empty" hidden>没有找到匹配的文章</div>' +
    '<nav id="pagination" class="pagination"></nav>';

  renderStats(posts);

  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', function () {
    homeState.query = searchEl.value.trim().toLowerCase();
    homeState.page = 1;
    applyHome(posts);
  });
  document.getElementById('pagination').addEventListener('click', function (e) {
    const btn = e.target.closest('.page-btn');
    if (!btn || btn.disabled) return;
    homeState.page = Number(btn.dataset.page) || 1;
    applyHome(posts);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  applyHome(posts);
}

function applyHome(allPosts) {
  let list = allPosts;
  if (homeState.query) {
    list = list.filter(function (p) {
      const hay = [p.title, p.author, p.summary].join(' ').toLowerCase();
      return hay.indexOf(homeState.query) >= 0;
    });
  }
  const totalPages = Math.max(1, Math.ceil(list.length / CONFIG.pageSize));
  if (homeState.page > totalPages) homeState.page = totalPages;
  const start = (homeState.page - 1) * CONFIG.pageSize;
  renderPostList(list.slice(start, start + CONFIG.pageSize));
  renderPagination(totalPages, homeState.page);
}

function renderStats(posts) {
  const authors = new Set(posts.map(function (p) { return p.author; }).filter(Boolean));
  const latest = posts.length ? formatDate(posts[0].createdAt) : '—';
  document.getElementById('stats').innerHTML =
    statCard(posts.length, '文章总数', '') +
    statCard(authors.size, '作者数', '') +
    statCard(latest, '最近更新', 'font-size:16px');
}
function statCard(v, label, style) {
  return '<div class="stat-card"><div class="stat-value"' + (style ? ' style="' + style + '"' : '') + '>' +
    escapeHtml(String(v)) + '</div><div class="stat-label">' + escapeHtml(label) + '</div></div>';
}

function renderPostList(posts) {
  const listEl = document.getElementById('post-list');
  const emptyEl = document.getElementById('empty');
  if (!posts.length) { listEl.innerHTML = ''; emptyEl.hidden = false; return; }
  emptyEl.hidden = true;
  listEl.innerHTML = posts.map(function (p) {
    return '<article class="post-card">' +
      '<h2><a href="#/post/' + encodeURIComponent(p.id) + '">' + escapeHtml(p.title) + '</a></h2>' +
      '<div class="post-meta">' + escapeHtml(p.author || '匿名') + ' - ' + formatDate(p.createdAt) + '</div>' +
      (p.summary ? '<p class="post-summary">' + escapeHtml(p.summary) + '</p>' : '') +
    '</article>';
  }).join('');
}

function renderPagination(total, current) {
  const el = document.getElementById('pagination');
  if (total <= 1) { el.innerHTML = ''; return; }
  let html = '<button class="page-btn" data-page="' + (current - 1) + '"' + (current === 1 ? ' disabled' : '') + '>‹</button>';
  for (let i = 1; i <= total; i++) {
    html += '<button class="page-btn' + (i === current ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
  }
  html += '<button class="page-btn" data-page="' + (current + 1) + '"' + (current === total ? ' disabled' : '') + '>›</button>';
  el.innerHTML = html;
}

/* ================= 归档页 ================= */
async function renderArchive() {
  let data;
  try { data = await getData(); }
  catch (e) { app.innerHTML = errorBlock(e.message); return; }

  const posts = sortByDateDesc(data.posts);
  document.title = '归档 - ' + (data.site.title || CONFIG.title);

  if (!posts.length) {
    app.innerHTML = '<h1 class="page-title">归档</h1><div class="empty">还没有文章</div>';
    return;
  }

  const groups = {};
  posts.forEach(function (p) {
    const d = new Date(p.createdAt);
    const key = isNaN(d)
      ? '未知日期'
      : d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  let html = '<h1 class="page-title">归档</h1>';
  Object.keys(groups).forEach(function (key) {
    const list = groups[key];
    html += '<section class="archive-group">' +
      '<h2 class="archive-month">' + escapeHtml(key) + ' - ' + list.length + ' 篇</h2>' +
      '<ul class="archive-list">' +
      list.map(function (p) {
        return '<li>' +
          '<span class="archive-date">' + formatDate(p.createdAt) + '</span>' +
          '<a href="#/post/' + encodeURIComponent(p.id) + '">' + escapeHtml(p.title) + '</a>' +
          '<span class="archive-author">' + escapeHtml(p.author || '匿名') + '</span>' +
        '</li>';
      }).join('') +
      '</ul></section>';
  });
  app.innerHTML = html;
}

/* ================= 关于页 ================= */
async function renderAbout() {
  let data;
  try { data = await getData(); }
  catch (e) { app.innerHTML = errorBlock(e.message); return; }

  document.title = '关于 - ' + (data.site.title || CONFIG.title);

  const about = data.site.about;
  let body;
  if (typeof about === 'string' && about.trim()) body = mdToHtml(about);
  else body = '<p>© 2025-2026 弘九honjiu All rights reserved.<code>honjiu.neox.lol</code>，' +
    '</p>';

  app.innerHTML = '<h1 class="page-title">关于</h1>' +
    '<article class="article"><div class="article-body">' + body + '</div></article>';
}

/* ================= 文章页 ================= */
async function renderPost(id) {
  let data;
  try { data = await getData(); }
  catch (e) { app.innerHTML = errorBlock(e.message); return; }

  const posts = sortByDateDesc(data.posts);
  const idx = posts.findIndex(function (p) { return p.id === id; });

  if (idx < 0) {
    app.innerHTML = '<a class="back-link" href="#/">← 返回文章列表</a>' +
      '<div class="article"><p class="empty">文章不存在：' + escapeHtml(id) + '</p></div>';
    return;
  }

  const post = posts[idx];
  document.title = post.title + ' - ' + (data.site.title || CONFIG.title);

  app.innerHTML =
    '<a class="back-link" href="#/">← 返回文章列表</a>' +
    '<article class="article">' +
      '<h1 class="article-title">' + escapeHtml(post.title) + '</h1>' +
      '<div class="article-meta">' + escapeHtml(post.author || '匿名') + ' - ' + formatDate(post.createdAt) + '</div>' +
      '<div class="article-body" id="article-body"><p class="empty">正文加载中…</p></div>' +
    '</article>' +
    '<div id="post-nav" class="post-nav"></div>';

  let md = '';
  if (post.file) {
    try {
      const res = await fetch(CONFIG.mdDir + post.file, { cache: 'no-store' });
      if (!res.ok) throw new Error('无法加载 ' + post.file + '（HTTP ' + res.status + '）');
      md = await res.text();
    } catch (e) {
      document.getElementById('article-body').innerHTML =
        '<div class="error-box"><h3>正文加载失败</h3><p>' + escapeHtml(e.message) + '</p></div>';
      return;
    }
  } else if (typeof post.content === 'string') {
    md = post.content;
  } else {
    document.getElementById('article-body').innerHTML =
      '<div class="error-box"><h3>正文缺失</h3><p>该文章既没有 <code>file</code> 字段也没有 <code>content</code> 字段。</p></div>';
    return;
  }

  document.getElementById('article-body').innerHTML = mdToHtml(md);

  const prev = posts[idx - 1];
  const next = posts[idx + 1];
  const navEl = document.getElementById('post-nav');
  if (prev || next) {
    let html = '';
    html += prev
      ? '<a href="#/post/' + encodeURIComponent(prev.id) + '">' +
        '<div class="nav-label">← 最新更新</div>' +
        '<div class="nav-title">' + escapeHtml(prev.title) + '</div></a>'
      : '<span></span>';
    html += next
      ? '<a class="nav-right" href="#/post/' + encodeURIComponent(next.id) + '">' +
        '<div class="nav-label">更早的一篇 →</div>' +
        '<div class="nav-title">' + escapeHtml(next.title) + '</div></a>'
      : '<span></span>';
    navEl.innerHTML = html;
  }
}

  if (btn) btn.classList.toggle('show', window.scrollY > 300);

updateSiteTitle();
render();
